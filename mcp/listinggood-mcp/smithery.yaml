# Smithery manifest for ListingGood MCP Server
# 提交方式：仓库根目录放本文件，再到 https://smithery.ai 用 GitHub 登录提交。
# 注意：Smithery 会实际运行本服务，需先把包发到 PyPI（见下方说明），
# 否则 uvx 拉不到包。mcp.so / PulseMCP 是目录型，不需要 PyPI，优先提交它们。

name: listinggood-mcp
displayName: ListingGood — Free Amazon Listing Tools
description: >-
  Free, local, no-API-key Amazon listing tools as MCP: generate a full compliant
  listing, optimize titles for A9/A10, turn features into benefit-led bullets, and
  audit listings for compliance red lines. Works with Claude Desktop, Cursor,
  VS Code, Windsurf, Cline. Full SaaS with deep multi-marketplace scan at
  https://www.listinggood.com.
startCommand:
  type: stdio
  command: uvx
  args:
    - listinggood-mcp
# PyPI 发布后 uvx 才能拉到包；发 PyPI：
#   pip install build twine && python -m build && twine upload dist/*
