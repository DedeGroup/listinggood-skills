name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mcp-registry.yml'
      - 'server.json'
      - 'mcp/listinggood-electronics/server.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          curl -L -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz
          ./mcp-publisher --help

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish --file server.json
          ./mcp-publisher publish --file mcp/listinggood-electronics/server.json
