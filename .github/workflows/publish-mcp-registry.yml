name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mcp-registry.yml'
      - 'server.json'
      - 'mcp/listinggood-electronics/server.json'
      - 'mcp/listinggood-toys/server.json'
      - 'mcp/listinggood-beauty/server.json'
      - 'mcp/listinggood-furniture/server.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          curl -L -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz
          ./mcp-publisher --help

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # Republishing the same version fails with "duplicate version"; tolerate
          # that so the run stays green. Bump a server.json's "version" to re-publish.
          ./mcp-publisher publish --file server.json || echo "root: skip (already published / duplicate version)"
          ./mcp-publisher publish --file mcp/listinggood-electronics/server.json || echo "electronics: skip (already published / duplicate version)"
          ./mcp-publisher publish --file mcp/listinggood-toys/server.json || echo "toys: skip (already published / duplicate version)"
          ./mcp-publisher publish --file mcp/listinggood-beauty/server.json || echo "beauty: skip (already published / duplicate version)"
          ./mcp-publisher publish --file mcp/listinggood-furniture/server.json || echo "furniture: skip (already published / duplicate version)"
